<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="명단을 넣으면 이름표 단 카트들이 레이스를 펼치고, 정한 순위로 들어온 사람이 발표자가 되는 게임">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>발표자 그랑프리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: full-bleed 3D track behind; a pit-board panel docks left (bottom sheet on phones); race HUD floats on the edges. */
:root{
  --asphalt:#14161b;
  --panel:#1d2027;
  --panel-2:#262a33;
  --line:#383d49;
  --ink:#f4f2ec;
  --muted:#a2a8b4;
  --signal:#ffd23f;
  --signal-ink:#16130a;
  --flag:#e63946;
  --go:#3ccf7a;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-num:"Chakra Petch","Noto Sans KR",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--asphalt);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

/* ---------- Setup panel ---------- */
#setup{
  position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100% - 32px));display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.checker{height:14px;flex:none;background:
  conic-gradient(var(--ink) 25%,var(--asphalt) 0 50%,var(--ink) 0 75%,var(--asphalt) 0) 0 0/14px 14px}
.panel-head{padding:18px 20px 14px;background:var(--signal);color:var(--signal-ink);flex:none}
.panel-head .eyebrow{font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.panel-head h1{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.05;text-wrap:balance}
.panel-head .copy{margin:4px 0 0;font-family:var(--f-num);font-weight:600;font-size:12px;letter-spacing:.04em;opacity:.7}
.panel-body{flex:1;overflow:auto;padding:18px 20px 20px;display:flex;flex-direction:column;gap:22px;min-height:0}
.step{display:flex;flex-direction:column;gap:10px}
.step-label{display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:15px}
.step-label .n{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--signal-ink);background:var(--signal);border-radius:4px;padding:1px 6px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5}
textarea,input[type=text]{
  width:100%;box-sizing:border-box;background:var(--asphalt);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font:500 15px/1.5 var(--f-body);resize:vertical
}
textarea{min-height:84px}
.grid-count{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.grid-count b{color:var(--ink);font-family:var(--f-num);font-size:14px}
.plates{display:flex;flex-wrap:wrap;gap:6px}
.plate-chip{display:inline-flex;align-items:center;gap:6px;background:var(--signal);color:var(--signal-ink);border-radius:5px;padding:3px 8px 3px 3px;font-weight:900;font-size:13px;box-shadow:inset 0 0 0 2px #111}
.plate-chip .num{font-family:var(--f-num);font-weight:700;font-size:11px;background:#111;color:#fff;border-radius:3px;padding:1px 5px}
.plate-chip .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px #111}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--asphalt);padding:5px;border-radius:12px;border:1px solid var(--line)}
.seg button{background:transparent;border:0;border-radius:8px;padding:9px 4px;font-weight:700;font-size:14.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button small{font-weight:500;font-size:11px;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--signal)}
.maps{display:grid;gap:6px}
.map{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:12px;text-align:left;background:var(--asphalt);border:1px solid var(--line);border-radius:11px;padding:7px 10px 7px 7px}
.map:hover{border-color:#555c6b}
.map[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--signal);border-color:transparent}
.map .sw{height:38px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.map .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
.map b{font-size:14.5px}
.map small{font-size:11.5px;color:var(--muted)}
.sw-forest{background:linear-gradient(180deg,#9ed8ff 0 42%,#2f7d3a 42% 62%,#66b04f 62% 78%,#3b3f47 78%)}
.sw-desert{background:linear-gradient(180deg,#ffd8a6 0 42%,#c46a42 42% 62%,#e3b77a 62% 78%,#5b4b40 78%)}
.sw-snow{background:linear-gradient(180deg,#cfe3f2 0 38%,#8fa3b8 38% 50%,#ffffff 50% 78%,#465163 78%)}
.verdict{font-size:13.5px;line-height:1.5;background:var(--panel-2);border-radius:10px;padding:10px 12px}
.verdict.err{background:rgba(230,57,70,.16);color:#ffb3b9}
.verdict b{color:var(--signal)}
.go{
  flex:none;margin:0 20px 20px;padding:15px;border:0;border-radius:12px;background:var(--flag);color:#fff;
  font-family:var(--f-display);font-size:24px;letter-spacing:.04em;box-shadow:0 6px 0 #9d1f2a;transition:transform .08s,box-shadow .08s
}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #9d1f2a}
.go:disabled{background:var(--line);box-shadow:0 6px 0 #22252c;cursor:not-allowed;color:var(--muted)}

/* ---------- HUD ---------- */
.hud{position:fixed;pointer-events:none}
.hud > *{pointer-events:auto}
#hudTop{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;width:184px}
.topline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.minimap{position:relative;width:184px;height:250px;background:rgba(20,22,27,.85);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);overflow:hidden}
.minimap canvas{display:block;width:100%;height:100%}
.minimap .cap{position:absolute;left:10px;top:7px;font-family:var(--f-num);font-weight:700;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.shuffle{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-weight:700;font-size:14px}
.shuffle:hover{border-color:var(--signal)}
.shuffle svg{width:16px;height:16px;fill:none;stroke:var(--signal);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.plates-cap{font-size:12px;color:var(--muted);margin:0}
.tag{background:rgba(20,22,27,.82);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;backdrop-filter:blur(6px)}
.tag .k{color:var(--muted);font-weight:500;margin-right:6px}
#timer{font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
.progress{position:relative;height:22px;background:rgba(20,22,27,.75);border:1px solid var(--line);border-radius:11px;backdrop-filter:blur(6px)}
.progress .flag{position:absolute;right:4px;top:3px;width:14px;height:14px;border-radius:3px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/7px 7px}
.progress .pdot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;box-shadow:0 0 0 2px #111;transition:width .2s,height .2s}
.progress .pdot.on{width:16px;height:16px;margin:-8px 0 0 -8px;box-shadow:0 0 0 2px #111,0 0 0 4px var(--signal)}

#standings{
  top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:210px;max-height:calc(100% - 200px);overflow:auto;
  background:rgba(20,22,27,.85);border:1px solid var(--line);border-radius:12px;padding:6px;backdrop-filter:blur(6px)
}
#standings .head{display:flex;justify-content:space-between;padding:4px 6px 6px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.row{display:grid;grid-template-columns:26px 10px 1fr auto;align-items:center;gap:7px;width:100%;background:transparent;border:0;border-radius:7px;padding:5px 6px;text-align:left;font-size:13.5px}
.row:hover{background:var(--panel-2)}
.row.slot{box-shadow:inset 0 0 0 2px var(--signal)}
.row.follow{background:#3a404d}
.row.follow .nm::before{content:"";display:inline-block;width:0;height:0;border-left:6px solid var(--ink);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:5px;vertical-align:1px}
.name-msg{margin:0;font-size:13px;font-weight:700;color:#ff8a93;background:rgba(230,57,70,.16);border-radius:8px;padding:7px 10px}
.row .rk{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.row.done .rk{color:var(--signal)}
.row .dot{width:10px;height:10px;border-radius:50%}
.row .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .gap{font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.pick .nm::after{content:"발표";margin-left:5px;font-size:10px;font-weight:700;background:var(--flag);color:#fff;border-radius:3px;padding:0 4px;vertical-align:2px}

#bottom{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;pointer-events:none}
#caster{pointer-events:none;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 476px));text-align:center}
#caster .line{text-align:center}
.ctrls button.strong{background:var(--ink);color:var(--asphalt);border-color:var(--ink)}
#pauseOv{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,11,14,.45);pointer-events:none}
#pauseOv .pv{font-family:var(--f-display);font-size:clamp(40px,10vw,88px);color:var(--ink);text-shadow:0 5px 0 #111;text-align:center}
#pauseOv small{display:block;font-family:var(--f-body);font-weight:700;font-size:15px;color:var(--signal);text-shadow:none;margin-top:4px}
@media (max-width:900px){
  #caster{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));transform:none;width:auto}
  #hudTop,#standings{top:calc(84px + env(safe-area-inset-top,0px))}
}
#caster .mic{display:inline-block;font-family:var(--f-num);font-size:11px;font-weight:700;letter-spacing:.12em;background:var(--flag);color:#fff;padding:2px 8px;border-radius:4px 4px 0 0}
#caster .line{background:rgba(20,22,27,.88);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:10px 14px;font-weight:700;font-size:16px;line-height:1.45;min-height:24px}
#caster .line.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.ctrls{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.ctrls button{background:rgba(20,22,27,.88);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:700}
.ctrls button[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}

#count{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-size:min(34vw,220px);color:var(--signal);text-shadow:0 8px 0 #111,0 0 40px rgba(0,0,0,.5)}
#count.go-txt{color:var(--go)}
#count span{animation:zoom .7s ease-out both}
@keyframes zoom{from{transform:scale(1.8);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:1}}

#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center}
#toast .t{font-family:var(--f-display);font-size:clamp(28px,7vw,54px);color:#fff;text-shadow:0 4px 0 #111,0 0 24px rgba(0,0,0,.6);white-space:nowrap;animation:pop .4s ease-out}
#toast .t small{display:block;font-family:var(--f-body);font-weight:900;font-size:.36em;color:var(--signal);letter-spacing:.08em}

/* ---------- Result ---------- */
#result{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,11,14,.62);backdrop-filter:blur(3px);padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .45s ease-out}
.card-head{background:var(--signal);color:var(--signal-ink);padding:18px 22px 16px}
.card-head .eyebrow{font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.14em}
.card-head h2{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1.1}
.card-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:18px}
.winners{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.winners li{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:12px}
.winners .rk{font-family:var(--f-num);font-weight:700;font-size:22px;text-align:center;background:var(--flag);color:#fff;border-radius:8px;padding:6px 0;font-variant-numeric:tabular-nums}
.winners .pl{display:flex;align-items:center;gap:10px;background:var(--signal);color:var(--signal-ink);border-radius:8px;padding:8px 12px;box-shadow:inset 0 0 0 3px #111;font-family:var(--f-display);font-size:28px;line-height:1.1;min-width:0;overflow:hidden}
.winners .pl .dot{flex:none;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #111}
.full-h{font-size:12px;color:var(--muted);letter-spacing:.08em;margin:0 0 6px}
.full{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 12px;font-size:13.5px}
.full li{display:flex;gap:8px;align-items:center;min-width:0}
.full .r{font-family:var(--f-num);font-weight:700;color:var(--muted);width:24px;font-variant-numeric:tabular-nums}
.full .tm{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.full li.pick{color:var(--signal)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{border:0;border-radius:10px;padding:12px;font-weight:900;font-size:15px}
.actions .primary{background:var(--flag);color:#fff}
.actions .secondary{background:var(--panel-2);border:1px solid var(--line)}

@media (max-width:640px){
  #setup{top:auto;height:min(62%,560px);width:auto;right:max(16px,env(safe-area-inset-right,0px))}
  .panel-head{padding:12px 16px 10px}
  .panel-head h1{font-size:26px}
  .panel-body{padding:14px 16px;gap:16px}
  .go{margin:0 16px 16px;padding:12px;font-size:21px}
  #hudTop{width:118px}
  .minimap{width:118px;height:170px}
  #timer{min-width:0;font-size:14px}
  #standings{width:146px;max-height:42%}
  .row{grid-template-columns:20px 8px 1fr;font-size:12.5px;gap:5px}
  .row .gap{display:none}
  #caster .line{font-size:14px;padding:8px 10px}
  #hudTop,#standings{top:calc(78px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stage" aria-label="카트 레이스 화면"></canvas>

<section id="setup" aria-label="레이스 설정">
  <div class="panel-head">
    <div class="eyebrow">Presenter Grand Prix</div>
    <h1>발표자 그랑프리</h1>
    <p class="copy">© zyoont All rights reserved.</p>
  </div>
  <div class="checker"></div>
  <div class="panel-body">
    <div class="step">
      <label class="step-label" for="names"><span class="n">1</span>참가자 명단</label>
      <textarea id="names" spellcheck="false">김가영, 김나영, 김다영, 김라영, 김마영, 김바영</textarea>
      <p class="name-msg" id="nameMsg" role="alert" hidden></p>
      <div class="grid-count"><span class="hint">쉼표나 줄바꿈으로 구분 · 2~30명</span><span id="countTxt"><b>6</b>대 출전</span></div>
      <p class="plates-cap">출발 그리드 순서 (앞줄부터)</p>
      <div class="plates" id="plates"></div>
      <button type="button" class="shuffle" id="shuffle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>위치 섞기</button>
    </div>
    <div class="step">
      <div class="step-label"><span class="n">2</span>몇 등이 발표할까요?</div>
      <div class="seg" role="group" aria-label="발표자 순위">
        <button type="button" id="m-first" data-mode="first" aria-pressed="true">처음<small>1등</small></button>
        <button type="button" id="m-last" data-mode="last" aria-pressed="false">마지막<small>꼴찌</small></button>
        <button type="button" id="m-multi" data-mode="multi" aria-pressed="false">여러명<small>직접 입력</small></button>
      </div>
      <div id="multiWrap" hidden>
        <input type="text" id="ranks" placeholder="예: 1-3 또는 1,3" inputmode="text" autocomplete="off">
        <p class="hint" style="margin:6px 0 0">1등부터 3등까지는 <b>1-3</b>, 1등과 3등은 <b>1,3</b>. 섞어서 <b>1-2,5</b>도 됩니다.</p>
      </div>
      <div class="verdict" id="verdict" aria-live="polite"></div>
    </div>
    <div class="step">
      <div class="step-label"><span class="n">3</span>맵 선택</div>
      <div class="maps" role="group" aria-label="맵 선택">
        <button type="button" class="map" id="map-forest" data-map="forest" aria-pressed="true"><span class="sw sw-forest"></span><span class="mt"><b>포레스트 맵</b><small>초록 숲길 · 부드러운 커브</small></span></button>
        <button type="button" class="map" id="map-desert" data-map="desert" aria-pressed="false"><span class="sw sw-desert"></span><span class="mt"><b>데저트 맵</b><small>모래 협곡 · 긴 직선 질주</small></span></button>
        <button type="button" class="map" id="map-snow" data-map="snow" aria-pressed="false"><span class="sw sw-snow"></span><span class="mt"><b>스노우 맵</b><small>눈 덮인 산길 · 급커브 연속</small></span></button>
      </div>
    </div>
  </div>
  <button class="go" id="goBtn" type="button">출발!</button>
</section>

<div class="hud" id="hudTop" hidden>
  <div class="topline">
    <span class="tag" id="timer">0.00</span>
    <span class="tag"><span class="k">발표</span><span id="pickTxt">1위</span></span>
  </div>
  <div class="minimap"><span class="cap">COURSE</span><canvas id="mini" aria-label="코스 약도"></canvas></div>
</div>
<aside class="hud" id="standings" hidden aria-label="실시간 순위">
  <div class="head"><span>실시간 순위</span><span>누르면 카메라 이동</span></div>
  <div id="rows"></div>
</aside>

function buildTrack(n){
  if(track){ scene.remove(track.group); track.group.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); } }); }

  const W = Math.max(13, lanes*3.3 + 5);

    const rx=-t.z, rz=t.x, k=Math.hypot(rx,rz)||1, hx=rx/k*W/2, hz=rz/k*W/2;

    const fg=new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.BufferAttribute(fp,3));
    flakes=new THREE.Points(fg, new THREE.PointsMaterial({color:0xffffff, size:.32, transparent:true, opacity:.92, depthWrite:false}));

    const postMat = new THREE.MeshLambertMaterial({color:finish?0x1a1a1a:th.post});
    for(const s of [-1,1]){ const post=new THREE.Mesh(new THREE.BoxGeometry(.7,6.8,.7),postMat); post.position.set(s*(W/2+1.2),3.4,0); a.add(post); }
    const ban = new THREE.Mesh(new THREE.PlaneGeometry(W+3.2, 2), new THREE.MeshBasicMaterial({map:bannerTexture(text,finish), side:THREE.DoubleSide}));
    ban.position.y=6.4; ban.rotation.y=Math.PI; a.add(ban);

function makeKart(name, i){

  const accent = lum(color) > .55 ? mix(color, 0x000000, .22) : mix(color, 0xffffff, .32); // tone-on-tone, not loud
  const body = new THREE.MeshLambertMaterial({map:patternTexture(pattern, color, accent)}), dark = new THREE.MeshLambertMaterial({color:0x1b1d22}), tire = new THREE.MeshLambertMaterial({color:0x111111});
  const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); k.add(m); return m;};
  add(new THREE.BoxGeometry(1.7,.34,2.6), body, 0,.45,0);
  add(new THREE.BoxGeometry(1.2,.3,.8), body, 0,.42,1.55);

  const wheels=[];
  for(const [x,z,w] of [[.9,.95,.3],[-.9,.95,.3],[.95,-.9,.42],[-.95,-.9,.42]]){
    const wh = new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,w,14), tire); wh.rotation.z=Math.PI/2;

  }
  add(new THREE.BoxGeometry(1.9,.08,.42), body, 0,1.28,-1.22);
  add(new THREE.BoxGeometry(.08,.5,.08), dark, .6,1.02,-1.22); add(new THREE.BoxGeometry(.08,.5,.08), dark, -.6,1.02,-1.22);
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.52,.594), new THREE.MeshBasicMaterial({map:plateTexture(name,i+1)}));

  const flame = new THREE.Mesh(new THREE.ConeGeometry(.24,1.1,8), new THREE.MeshBasicMaterial({color:0xff9a1f, transparent:true, opacity:.9}));
  flame.rotation.x=-Math.PI/2; flame.position.set(0,.55,-1.9); flame.visible=false; k.add(flame);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(1.5,20), new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28}));

function clearKarts(){ karts.forEach(k=>{ scene.remove(k.group); k.group.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); } }); }); karts=[]; }

const _p=new V3(), _t=new V3();
function placeKart(k){
  const u = Math.min(Math.max(k.dist/track.L,0),1);
  track.curve.getPointAt(u,_p); track.curve.getTangentAt(u,_t);
  const rx=-_t.z, rz=_t.x;
  k.group.position.set(_p.x+rx*k.lat, 0, _p.z+rz*k.lat);
  k.group.lookAt(k.group.position.x+_t.x, 0, k.group.position.z+_t.z);
}
let gridOrder = []; // slot -> kart index
function slotPos(slot){
  const lanes=track.lanes, row=Math.floor(slot/lanes), c=slot%lanes;
  return {lat:(c-(lanes-1)/2)*3.3, dist:track.START - 3 - row*4.4 - (c%2)*1.2};
}
function gridKarts(snap=true){
  gridOrder.forEach((ki,slot)=>{
    const k=karts[ki], s=slotPos(slot);
    k.gDist=s.dist; k.gLat=s.lat; k.latT=s.lat;
    if(snap){ k.dist=s.dist; k.lat=s.lat; k.group.position.y=0; }
    k.speed=0; k.boost=0; k.finished=false; k.rank=0; k.time=0; k.flame.visible=false;
    placeKart(k);
  });
}
function rebuildWorld(){
  buildTrack(names.length||2);
  clearKarts();
  karts = names.map((n,i)=>makeKart(n,i));
  gridOrder = karts.map((_,i)=>i);
  gridKarts();
}
function renderPlates(){
  $('#plates').innerHTML = gridOrder.map(i=>`<span class="plate-chip"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="dot" style="background:${hex(COLORS[i%COLORS.length])}"></span>${esc(names[i])}</span>`).join('');
}
function shuffleGrid(){
  if(karts.length<2) return;
  const prev = gridOrder.join();
  do{ for(let i=gridOrder.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [gridOrder[i],gridOrder[j]]=[gridOrder[j],gridOrder[i]]; } } while(gridOrder.join()===prev);
  gridKarts(false);
  renderPlates();
}
function settleGrid(dt){
  const a = 1 - Math.exp(-dt*4);
  karts.forEach(k=>{
    const dd=k.gDist-k.dist, dl=k.gLat-k.lat;
    k.dist += dd*a; k.lat += dl*a;
    placeKart(k);
    k.group.position.y = Math.min(1.4, Math.hypot(dd,dl)*0.18);

}

/* ---------- Minimap ---------- */
const mini = $('#mini'), mctx = mini.getContext('2d');
function sizeMini(){ const r=mini.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2); if(r.width){ mini.width=Math.round(r.width*d); mini.height=Math.round(r.height*d); } }
addEventListener('resize', sizeMini);
function drawMinimap(tgt){
  if(!track || !mini.width) return;
  const W=mini.width, H=mini.height, d=W/ (mini.getBoundingClientRect().width||W);
  const m = track.map, pad=14*d, top=22*d;
  const s = Math.min((W-pad*2)/(m.maxX-m.minX||1), (H-pad-top)/(m.maxZ-m.minZ||1));
  const ox = W/2 - (m.minX+m.maxX)/2*s, oy = top + (H-pad-top)/2 - (m.minZ+m.maxZ)/2*s;
  const X=x=>ox+x*s, Y=z=>oy+z*s;
  mctx.clearRect(0,0,W,H);
  mctx.lineCap='round'; mctx.lineJoin='round';
  const path=()=>{ mctx.beginPath(); m.pts.forEach(([x,z],i)=> i?mctx.lineTo(X(x),Y(z)):mctx.moveTo(X(x),Y(z))); };
  path(); mctx.strokeStyle='#0b0c0f'; mctx.lineWidth=9*d; mctx.stroke();
  path(); mctx.strokeStyle='#5d6370'; mctx.lineWidth=5*d; mctx.stroke();
  // driven part (by the leader) in signal yellow
  const leadDist = Math.max(...karts.map(k=>k.dist));
  const upto = Math.floor(Math.min(1, leadDist/track.L) * (m.pts.length-1));
  if(upto>0){ mctx.beginPath(); for(let i=0;i<=upto;i++){ const [x,z]=m.pts[i]; i?mctx.lineTo(X(x),Y(z)):mctx.moveTo(X(x),Y(z)); } mctx.strokeStyle='rgba(255,210,63,.55)'; mctx.lineWidth=2*d; mctx.stroke(); }
  // start & finish ticks
  const tick=(dist,finish)=>{
    track.curve.getPointAt(dist/track.L,_p); track.curve.getTangentAt(dist/track.L,_t);
    const nx=-_t.z, nz=_t.x, L=7*d;
    const x=X(_p.x), y=Y(_p.z);
    if(finish){
      for(let j=-2;j<2;j++){ mctx.fillStyle = j%2?'#111':'#fff';
        mctx.save(); mctx.translate(x+nx*(j+.5)*L/2, y+nz*(j+.5)*L/2); mctx.rotate(Math.atan2(nz,nx)); mctx.fillRect(-L/4,-L/3,L/2,L/1.5); mctx.restore(); }
    } else { mctx.beginPath(); mctx.moveTo(x-nx*L,y-nz*L); mctx.lineTo(x+nx*L,y+nz*L); mctx.strokeStyle='#ffd23f'; mctx.lineWidth=2.5*d; mctx.stroke(); }
  };
  tick(track.START,false); tick(track.FINISH,true);
  // karts
  const dot=(k,r)=>{ mctx.beginPath(); mctx.arc(X(k.group.position.x),Y(k.group.position.z),r,0,Math.PI*2); mctx.fillStyle=hex(k.color); mctx.fill(); mctx.lineWidth=1.6*d; mctx.strokeStyle='#111'; mctx.stroke(); };
  karts.forEach(k=>{ if(k!==tgt) dot(k,3.6*d); });
  if(tgt){
    const x=X(tgt.group.position.x), y=Y(tgt.group.position.z);
    mctx.beginPath(); mctx.arc(x,y,8*d,0,Math.PI*2); mctx.strokeStyle='#ffd23f'; mctx.lineWidth=2.5*d; mctx.stroke();
    dot(tgt,4.6*d);
    mctx.font=`900 ${11*d}px "Noto Sans KR", sans-serif`; mctx.textBaseline='middle';
    const tw=mctx.measureText(tgt.name).width, lx = x+11*d+tw > W-4*d ? x-11*d-tw : x+11*d;
    mctx.lineWidth=3*d; mctx.strokeStyle='#111'; mctx.strokeText(tgt.name,lx,y); mctx.fillStyle='#fff'; mctx.fillText(tgt.name,lx,y);
  }
}

/* ---------- Setup UI ---------- */
function parseNames(txt){
  const raw = txt.split(/[,，、\n\t;]+/).map(s=>s.trim()).filter(Boolean);
  const seen = {}, out=[];
  for(const n of raw){ let nm=n.slice(0,10); if(seen[nm]){ seen[nm]++; nm = nm + seen[nm]; } else seen[nm]=1; out.push(nm); if(out.length>=30) break; }
  return out;
}
function parseRanks(m, txt, n){
  if(n<2) return {ok:false, msg:'참가자를 2명 이상 넣어 주세요.'};
  if(m==='first') return {ok:true, ranks:[1]};
  if(m==='last') return {ok:true, ranks:[n]};
  const s = (txt||'').replace(/\s/g,'').replace(/[~∼〜]/g,'-').replace(/[등위]/g,'');
  if(!s) return {ok:false, msg:'순위를 입력해 주세요. 예: 1-3 또는 1,3'};
  const set = new Set();
  for(const tok of s.split(',')){
    if(!tok) continue;
    let a,b,mm;
    if((mm=tok.match(/^(\d+)$/))){ a=b=+mm[1]; }
    else if((mm=tok.match(/^(\d+)-(\d+)$/))){ a=+mm[1]; b=+mm[2]; if(a>b)[a,b]=[b,a]; }
    else return {ok:false, msg:`"${tok}"는 읽을 수 없어요. 1-3이나 1,3처럼 써 주세요.`};
    if(a<1||b>n) return {ok:false, msg:`참가자가 ${n}명이라 1부터 ${n}까지만 고를 수 있어요.`};
    for(let i=a;i<=b;i++) set.add(i);
  }
  if(!set.size) return {ok:false, msg:'순위를 입력해 주세요. 예: 1-3 또는 1,3'};
  return {ok:true, ranks:[...set].sort((x,y)=>x-y)};
}
const rankLabel = r => r.map(x=>`${x}위`).join(', ');
function refreshVerdict(){
  const v = $('#verdict'), res = parseRanks(mode, $('#ranks').value, names.length);
  if(res.ok){
    pickRanks = res.ranks;
    const who = mode==='last' ? `꼴찌(${names.length}위)` : rankLabel(pickRanks);
    v.className='verdict'; v.innerHTML = `결승선을 <b>${esc(who)}</b>로 통과한 사람이 발표합니다. 발표자 ${pickRanks.length}명.`;
  } else { v.className='verdict err'; v.textContent = res.msg; }
  $('#goBtn').disabled = !res.ok;
  return res.ok;
}
function refreshNames(){

/* ---------- Audio ---------- */
function beep(f, d=0.15, type='square', vol=0.08){
  if(!audio) return;
  const o=audio.createOscillator(), g=audio.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(vol,audio.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+d);
  o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime+d);
}

/* ---------- BGM: one synthesized loop per map ---------- */
const BGM = (()=>{
  let ctx=null, bus=null, timer=null, step=0, nextT=0, tempo=150, enabled=true, playing=false, paused=false, noise=null, song=null;
  const VOL=0.5, mf = m => 440*Math.pow(2,(m-69)/12);
  // Each song: tempo, bars, bass roots per bar, chord tones per bar, melody in 8th notes (0 = rest)
  const SONGS = {
    forest:{ // bright chiptune, A minor
      tempo:150, bars:4, root:[45,41,48,43],
      chord:[[69,72,76],[65,69,72],[67,72,76],[67,71,74]],
      mel:[76,0,76,74,72,74,76,0, 77,0,77,76,74,72,69,0, 72,0,72,74,76,79,76,74, 74,0,71,74,79,0,79,81],
      lead:'square', arp:'square', bass:'square', drums:'rock' },
    desert:{ // E phrygian dominant, plucked lead and hand drums
      tempo:138, bars:4, root:[40,41,38,40],
      chord:[[64,68,71],[65,69,72],[62,65,69],[64,68,71]],
      mel:[76,77,80,0,81,80,77,76, 77,0,81,0,84,83,81,77, 74,77,81,0,77,76,74,72, 71,72,76,0,80,0,76,0],
      lead:'pluck', arp:'pluck', bass:'saw', drums:'doumbek' },
    snow:{ // Jingle Bells (James Lord Pierpont, 1857, public domain) with sleigh bells
      tempo:160, bars:8, root:[48,48,41,43, 48,48,41,43],
      chord:[[72,76,79],[72,76,79],[72,77,81],[71,74,79],[72,76,79],[72,76,79],[72,77,81],[71,74,79]],
      mel:[76,76,76,0,76,76,76,0, 76,79,72,74,76,0,0,0, 77,77,77,77,77,76,76,76, 76,74,74,76,74,0,79,0,
           76,76,76,0,76,76,76,0, 76,79,72,74,76,0,0,0, 77,77,77,77,77,76,76,76, 79,79,77,74,72,0,0,0],
      lead:'bell', arp:'none', bass:'oompah', drums:'sleigh' },
  };
  try{ enabled = localStorage.getItem('pgp-bgm')!=='off'; }catch(e){}
  function init(c){
    if(ctx||!c) return; ctx=c; bus=ctx.createGain(); bus.gain.value=0;
    const comp=ctx.createDynamicsCompressor(); bus.connect(comp); comp.connect(ctx.destination);
    noise=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.5),ctx.sampleRate); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  function tone(type,freq,t,dur,vol,cut){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    let node=o; if(cut){ const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; o.connect(f); node=f; }
    node.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.02);
  }
  function bell(freq,t,vol){ // glockenspiel: fundamental + inharmonic partial, long ring
    tone('sine',freq,t,0.9,vol); tone('sine',freq*2.76,t,0.35,vol*0.35); tone('triangle',freq*2,t,0.25,vol*0.25);
  }
  function pluck(freq,t,dur,vol){
    const o=ctx.createOscillator(), f=ctx.createBiquadFilter(), g=ctx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(freq,t);
    f.type='lowpass'; f.frequency.setValueAtTime(3200,t); f.frequency.exponentialRampToValueAtTime(420,t+dur); f.Q.value=4;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.02);
  }
  function hit(t,dur,vol,type,freq){
    const src=ctx.createBufferSource(); src.buffer=noise; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=ctx.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); src.connect(f); f.connect(g); g.connect(bus); src.start(t, Math.random()*0.3); src.stop(t+dur+0.02);
  }
  function drum(t,f0,f1,dur,vol,type='sine'){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.6);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.02);
  }
  function sleigh(t,vol){ for(let j=0;j<3;j++) hit(t+j*0.012, 0.07, vol*(1-j*0.25), 'bandpass', 8200+j*900); }
  function play(s,t){
    const S=song, sx=(60/tempo)/4, bar=Math.floor(s/16)%S.bars, i=s%16, root=S.root[bar], ch=S.chord[bar];
    // drums
    if(S.drums==='rock'){
      if(i%4===0) drum(t,150,42,0.2,0.55);
      if(i===4||i===12) hit(t,0.13,0.22,'bandpass',1900);
      if(i%2===0) hit(t,0.035,0.07,'highpass',7500);
    } else if(S.drums==='doumbek'){
      if(i===0||i===6||i===10) drum(t,120,60,0.22,0.55);
      if(i===4||i===12) drum(t,420,300,0.09,0.25,'triangle');
      if(i===14||i===15) drum(t,380,300,0.06,0.15,'triangle');
      if(i%2===1) hit(t,0.04,0.06,'bandpass',5200);
    } else if(S.drums==='sleigh'){
      if(i===0||i===8) drum(t,130,50,0.18,0.42);
      if(i===4||i===12) hit(t,0.16,0.12,'bandpass',2600);
      if(i%2===0) sleigh(t, i%4===2 ? 0.16 : 0.09);
    }
    // bass
    if(S.bass==='square'){ if(i%2===0) tone('square', mf(root + ((i/2)%2?12:0)), t, sx*1.7, 0.07, 700); }
    else if(S.bass==='saw'){ if(i%4===0||i===6||i===10) tone('sawtooth', mf(root), t, sx*1.6, 0.06, 500); }
    else if(S.bass==='oompah'){
      if(i%8===0) tone('triangle', mf(root), t, sx*3, 0.16);
      if(i%8===4) tone('triangle', mf(root+7), t, sx*3, 0.13);
      if(i%8===4) ch.forEach(n=>tone('triangle', mf(n-12), t, sx*1.5, 0.025)); // soft chord stab
    }
    // arpeggio
    if(S.arp==='square') tone('square', mf(ch[i%3]+12), t, sx*0.9, 0.02, 2600);
    else if(S.arp==='pluck' && i%2===1) pluck(mf(ch[(i>>1)%3]), t, sx*1.4, 0.03);
    // melody (8th notes)
    if(i%2===0){
      const m=S.mel[bar*8+i/2];
      if(m){
        if(S.lead==='square') tone('square', mf(m), t, sx*1.8, 0.045, 3200);
        else if(S.lead==='pluck') pluck(mf(m), t, sx*2.4, 0.07);
        else if(S.lead==='bell') bell(mf(m), t, 0.09);
      }
    }
  }
  function tick(){ const sx=(60/tempo)/4; if(nextT < ctx.currentTime-0.2) nextT=ctx.currentTime+0.02; while(nextT < ctx.currentTime+0.12){ play(step,nextT); nextT+=sx; step=(step+1)%(song.bars*16); } }
  function fade(to,time){ const g=bus.gain, n=ctx.currentTime; g.cancelScheduledValues(n); g.setValueAtTime(g.value,n); g.linearRampToValueAtTime(to,n+time); }
  function run(){ clearInterval(timer); nextT=ctx.currentTime+0.06; timer=setInterval(tick,25); tick(); fade(enabled?VOL:0,0.15); }
  return {
    init,
    get enabled(){ return enabled; },
    start(id){ if(!ctx) return; song=SONGS[id]||SONGS.forest; tempo=song.tempo; playing=true; paused=false; step=0; run(); },
    stop(){ if(!ctx) return; playing=false; clearInterval(timer); timer=null; fade(0,0.5); },
    pause(p){ if(!ctx||!playing) return; paused=p; if(p){ clearInterval(timer); timer=null; fade(0,0.12); } else run(); },
    speedUp(){ if(song) tempo=Math.round(song.tempo*1.12); },
    toggle(){ enabled=!enabled; try{ localStorage.setItem('pgp-bgm', enabled?'on':'off'); }catch(e){} if(ctx&&playing&&!paused) fade(enabled?VOL:0,0.2); return enabled; }
  };
})();
function syncBgmBtn(){ const b=$('#bgmBtn'); b.textContent = BGM.enabled ? '♪ BGM 켜짐' : '♪ BGM 꺼짐'; b.setAttribute('aria-pressed', BGM.enabled); }
$('#bgmBtn').addEventListener('click', ()=>{ BGM.toggle(); syncBgmBtn(); });
syncBgmBtn();

/* ---------- Race ---------- */
function show(id,on){ $(id).hidden=!on; }
function startRace(){
  try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); audio.resume && audio.resume(); BGM.init(audio); }catch(e){ audio=null; }
  gridKarts();
  finishCount=0; raceT=0; cdT=0; doneT=0; lastSay=-9; lastLeader=-1; lastTail=-1; said200=false; announcedPick=false; followIdx=null;
  karts.forEach(k=>{ k.react = Math.random()*0.35; k.target = 37+Math.random()*8; k.change = Math.random(); k.latT=k.lat; });
  $('#pickTxt').textContent = mode==='last' ? `꼴찌 (${names.length}위)` : rankLabel(pickRanks);
  setCam(null);
  show('#setup',false); show('#result',false); show('#hudTop',true); show('#standings',true); show('#bottom',true); show('#caster',true);
  setPause(false);
  sizeMini();
  say(`${MAPS[mapId].name}! 선수들 출발선에 섰습니다. 신호 기다립니다!`, true);
  phase='countdown'; lastCount=null;
}
let lastCount=null;
function countdown(dt){
  cdT += dt;
  const step = Math.floor(cdT/0.85);
  const labels=['3','2','1','GO!'];
  if(step!==lastCount && step<4){
    lastCount=step; const el=$('#count'); el.hidden=false; el.className = step===3?'go-txt':'';
    el.innerHTML=`<span>${labels[step]}</span>`; beep(step===3?880:440, step===3?0.4:0.18);
    if(step===3){ phase='race'; BGM.start(mapId); say('출발합니다! 모두 힘차게 튀어나갑니다!', true); setTimeout(()=>{ el.hidden=true; }, 700); }
  }
}
function say(text, force){
  if(!force && raceT - lastSay < 2.2) return;
  lastSay = raceT;
  const l=$('#casterLine'); l.textContent=text; l.classList.remove('pop'); void l.offsetWidth; l.classList.add('pop');
}
let toastTimer=null;
function toast(main, sub){
  const t=$('#toast'); t.hidden=false; t.innerHTML=`<div class="t">${sub?`<small>${esc(sub)}</small>`:''}${esc(main)}</div>`;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true, 1600);
}
function simulate(dt){
  raceT += dt;
  const span = track.FINISH - track.START;
  let lead = -1e9; karts.forEach(k=>{ if(!k.finished) lead=Math.max(lead,k.dist); });
  const bound = track.W/2 - 1.3;
  for(const k of karts){
    let tgt;
    if(raceT < k.react){ tgt = 0; }
    else if(!k.finished){
      const prog = (k.dist-track.START)/span;
      k.change -= dt;
      if(k.change<=0){ k.target = 36 + Math.random()*10 + (prog>0.65 ? (Math.random()-0.5)*10 : 0); k.change = 0.6 + Math.random()*1.5; }
      if(k.boost<=0 && raceT>1.5 && Math.random()<dt*0.065){
        k.boost = 0.9 + Math.random()*0.7;
        const lines=[`${k.name} 선수 부스터 발동!`,`${k.name}, 부스터로 치고 나갑니다!`,`${k.name} 선수 불꽃을 뿜어요!`];
        say(lines[(Math.random()*lines.length)|0]);
      }
      const rubber = Math.min(Math.max((lead - k.dist - 18)*0.14, 0), 6);
      tgt = k.target + (k.boost>0?15:0) + rubber;
    }
    if(k.finished) k.speed = Math.max(0, k.speed - 13*dt);
    else k.speed += (tgt - k.speed) * Math.min(1, dt*(tgt>k.speed?1.1:2));
    k.boost -= dt;
    k.dist = Math.min(k.dist + k.speed*dt, track.L - 4);
    // lateral wander
    if(Math.random()<dt*0.5 && !k.finished) k.latT = (Math.random()*2-1)*bound;
    k.lat += (k.latT - k.lat) * Math.min(1, dt*0.9);
    if(!k.finished && k.dist >= track.FINISH){
      k.finished=true; k.rank=++finishCount; k.time=raceT; k.boost=0;
      const pick = pickRanks.includes(k.rank);
      say(`${k.rank}위 ${k.name} 선수 골인!${pick?' 발표 당첨입니다!':''}`, true);
      toast(k.name, pick ? `${k.rank}위 · 발표자 당첨!` : `${k.rank}위 골인`);
      beep(pick?1046:660, pick?0.5:0.22, 'triangle', 0.12);
    }
  }
  // keep karts from overlapping
  for(let i=0;i<karts.length;i++) for(let j=i+1;j<karts.length;j++){
    const a=karts[i], b=karts[j], dd=a.dist-b.dist, dl=a.lat-b.lat;
    if(Math.abs(dd)<2.9 && Math.abs(dl)<1.9){
      const push=(1.9-Math.abs(dl))*0.5*Math.sign(dl||(Math.random()-.5));
      a.lat = Math.max(-bound,Math.min(bound,a.lat+push)); b.lat = Math.max(-bound,Math.min(bound,b.lat-push));
      a.latT = a.lat; b.latT = b.lat;
    }
  }
  karts.forEach(k=>{
    placeKart(k);
    k.wheels.forEach(w=>w.children[0].rotation.x += k.speed*dt/0.38);
    k.flame.visible = k.boost>0; if(k.flame.visible){ const s=0.8+Math.random()*0.6; k.flame.scale.set(1,s,1); }
  });
  // commentary on order
  const running = karts.filter(k=>!k.finished).sort((a,b)=>b.dist-a.dist);
  if(running.length>1 && raceT>2.5){
    const leader = karts.indexOf(running[0]), tail = karts.indexOf(running[running.length-1]);
    if(leader!==lastLeader && lastLeader!==-1) say(finishCount ? `남은 선수 중 ${running[0].name} 선수가 앞섭니다!` : `선두 교체! ${running[0].name} 선수가 맨 앞으로!`);
    else if(mode==='last' && tail!==lastTail && lastTail!==-1) say(`꼴찌 자리 바뀝니다. 지금 맨 뒤는 ${running[running.length-1].name} 선수!`);
    lastLeader=leader; lastTail=tail;
  }
  if(!said200 && running.length && track.FINISH - running[0].dist < 200){ said200=true; BGM.speedUp(); say(`결승선까지 200m! ${running[0].name} 선수가 앞서 있습니다!`, true); }
  if(!announcedPick && pickRanks.every(r=>r<=finishCount)){
    announcedPick=true;
    const who = pickRanks.map(r=>karts.find(k=>k.rank===r).name).join(', ');
    if(finishCount < karts.length) setTimeout(()=>say(`발표자 확정! ${who}`, true), 1200);
  }
  if(finishCount===karts.length){ doneT += dt; if(doneT>2.2 && phase==='race'){ phase='done'; showResult(); } }
}

/* ---------- Camera ---------- */
const camPos = new V3(), camLook = new V3(); let camInit=false;
function setCam(i){
  followIdx = i;
  if(phase==='race'||phase==='done') camInit = false; // cut straight to the chosen kart
  $('#camAuto').setAttribute('aria-pressed', i===null);
  updateHud(true);
}
$('#camAuto').addEventListener('click', ()=>setCam(null));
document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{
  timeScale=+b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',x===b));
}));
$('#rows').addEventListener('pointerdown', e=>{ const r=e.target.closest('.row'); if(r){ e.preventDefault(); setCam(+r.dataset.i); } });
$('#rows').addEventListener('keydown', e=>{ const r=e.target.closest('.row'); if(r && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); setCam(+r.dataset.i); } });

function camTarget(){
  if(followIdx!==null) return karts[followIdx];
  const running = karts.filter(k=>!k.finished);
  if(running.length) return running.reduce((a,b)=>b.dist>a.dist?b:a);
  return karts.find(k=>k.rank===finishCount) || karts[0];
}
let orbit=0;
function updateCamera(dt, now){
  const desired=new V3(), look=new V3();
  if(phase==='setup'){
    orbit += dt*0.18;
    const u=(track.START-8)/track.L; track.curve.getPointAt(u,_p);
    const R = 15 + karts.length*0.8;
    const narrow = innerWidth<=640;
    desired.set(_p.x+Math.sin(orbit)*R, 6+karts.length*0.2, _p.z+Math.cos(orbit)*R);
    look.set(_p.x, narrow?-2.5:1, _p.z);
    if(!narrow){ // nudge scene right of the panel
      const right = new V3().subVectors(look, desired).cross(new V3(0,1,0)).normalize();
      look.addScaledVector(right, -R*0.32);
    }
  } else if(phase==='countdown'){
    const back = track.START - 3 - Math.ceil(karts.length/track.lanes)*4.4 - 9;
    track.curve.getPointAt(Math.max(back,0)/track.L,_p); track.curve.getTangentAt(0,_t);
    desired.set(_p.x, 4.5, _p.z); look.set(_p.x+_t.x*30, 1.2, _p.z+_t.z*30);
  } else {
    const k = camTarget(); const u=Math.min(k.dist/track.L,1);
    track.curve.getTangentAt(u,_t);
    const kp=k.group.position;
    const back = 9.5 + Math.min(k.speed,60)*0.04;
    desired.set(kp.x-_t.x*back, 4.0, kp.z-_t.z*back);
    look.set(kp.x+_t.x*10, 1.3, kp.z+_t.z*10);
    const fov = 60 + Math.min(k.speed,60)*0.18; camera.fov += (fov-camera.fov)*Math.min(1,dt*2); camera.updateProjectionMatrix();
  }
  if(!camInit){ camPos.copy(desired); camLook.copy(look); camInit=true; }
  const a = 1 - Math.exp(-dt*(phase==='setup'?2:3.6));
  camPos.lerp(desired,a); camLook.lerp(look,a);
  camera.position.copy(camPos); camera.lookAt(camLook);
}

/* ---------- HUD ---------- */
let hudClock=0;
function standingsOrder(){
  return karts.map((k,i)=>({k,i})).sort((a,b)=>{
    if(a.k.finished&&b.k.finished) return a.k.rank-b.k.rank;
    if(a.k.finished) return -1; if(b.k.finished) return 1;
    return b.k.dist-a.k.dist;
  });
}
function updateHud(force){
  if(phase==='setup') return;
  $('#timer').textContent = raceT.toFixed(2);
  const tgt = phase==='race'||phase==='done' ? camTarget() : null;
  drawMinimap(tgt);
  if(!force && hudClock<0.12) return; hudClock=0;
  const ord = standingsOrder(); const lead = ord.find(o=>!o.k.finished);
  $('#rows').innerHTML = ord.map((o,pos)=>{
    const k=o.k, rk = k.finished?k.rank:pos+1;
    const gap = k.finished ? `${k.time.toFixed(2)}s` : (lead && lead.k!==k ? `-${Math.round(lead.k.dist-k.dist)}m` : `${Math.max(0,Math.round(track.FINISH-k.dist))}m`);
    const cls = ['row', k.finished?'done':'', pickRanks.includes(rk)?'slot':'', (k.finished&&pickRanks.includes(k.rank))?'pick':'', k===tgt?'follow':''].join(' ');
    return `<button type="button" class="${cls}" data-i="${o.i}"><span class="rk">${rk}</span><span class="dot" style="background:${hex(k.color)}"></span><span class="nm">${esc(k.name)}</span><span class="gap">${gap}</span></button>`;
  }).join('');
}

/* ---------- Result ---------- */
function showResult(){
  const byRank = [...karts].sort((a,b)=>a.rank-b.rank);
  const picks = pickRanks.map(r=>byRank[r-1]);
  const eyebrow = mode==='first' ? '1위 발표' : mode==='last' ? `꼴찌(${karts.length}위) 발표` : `${$('#ranks').value.trim()}위 발표`;
  $('#result').innerHTML = `<div class="card" role="dialog" aria-label="레이스 결과">
    <div class="card-head"><div class="eyebrow">${esc(eyebrow)} · 기록 ${raceT.toFixed(2)}s</div><h2>${picks.length>1?'오늘의 발표자들':'오늘의 발표자'}</h2></div>
    <div class="checker"></div>
    <div class="card-body">
      <ol class="winners">${picks.map(k=>`<li><span class="rk">${k.rank}위</span><span class="pl"><span class="dot" style="background:${hex(k.color)}"></span>${esc(k.name)}</span></li>`).join('')}</ol>
      <div><p class="full-h">전체 순위</p><ol class="full">${byRank.map(k=>`<li class="${pickRanks.includes(k.rank)?'pick':''}"><span class="r">${k.rank}</span>${esc(k.name)}<span class="tm">${k.time.toFixed(2)}</span></li>`).join('')}</ol></div>
      <div class="actions"><button type="button" class="primary" id="again">다시 달리기</button><button type="button" class="secondary" id="edit">명단 바꾸기</button></div>
    </div></div>`;
  show('#result',true);
  BGM.stop();
  beep(784,0.18,'triangle',0.1); setTimeout(()=>beep(1046,0.4,'triangle',0.1),180);
  say(`레이스 종료! 발표자는 ${picks.map(k=>k.name).join(', ')}!`, true);
  $('#again').addEventListener('click', ()=>{ trackSeed=(Math.random()*1e9)|0; rebuildWorld(); startRace(); });
  $('#edit').addEventListener('click', toSetup);
}
function toSetup(){
  BGM.stop();
  phase='setup'; setPause(false); show('#result',false); show('#hudTop',false); show('#standings',false); show('#bottom',false); show('#caster',false); show('#count',false); show('#toast',false);
  camera.fov=62; camera.updateProjectionMatrix();
  trackSeed=(Math.random()*1e9)|0; rebuildWorld(); show('#setup',true);
}

/* ---------- Loop ---------- */
let paused=false;
function setPause(on){
  paused = on && (phase==='race'||phase==='countdown');
  show('#pauseOv', paused);
  BGM.pause(paused);
  $('#pauseBtn').textContent = paused ? '▶ 계속하기' : '❚❚ 일시정지';
  $('#pauseBtn').setAttribute('aria-pressed', paused);
}
$('#pauseBtn').addEventListener('click', ()=>setPause(!paused));
$('#homeBtn').addEventListener('click', toSetup);
addEventListener('keydown', e=>{ if(e.key==='p'||e.key==='P'){ if(phase==='race'||phase==='countdown') setPause(!paused); } });
let last=performance.now();
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000); last=now; hudClock+=dt;
  if(paused){ renderer.render(scene,camera); requestAnimationFrame(frame); return; }
  if(phase==='setup') settleGrid(dt);
  else if(phase==='countdown') countdown(dt);
  else if(phase==='race'){ let rem=dt*timeScale; while(rem>0){ const s=Math.min(rem,1/60); simulate(s); rem-=s; } }
  updateCamera(dt, now);
  if(track && track.flakes){
    const a=track.flakes.geometry.attributes.position, v=a.array, cx=camera.position.x, cz=camera.position.z, w=now*0.001;
    for(let i=0;i<v.length;i+=3){
      v[i+1]-=dt*(4+(i%7)); v[i]+=Math.sin(w+i)*dt*0.8;
      if(v[i+1]<0) v[i+1]+=45;
      if(v[i]-cx>70) v[i]-=140; else if(v[i]-cx<-70) v[i]+=140;
      if(v[i+2]-cz>70) v[i+2]-=140; else if(v[i+2]-cz<-70) v[i+2]+=140;
    }
    a.needsUpdate=true;
  }
  updateHud(false);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
try{ const saved=localStorage.getItem('pgp-names'); if(saved && saved.trim()) $('#names').value=saved; }catch(e){}
const boot = () => { lastValid = $('#names').value; refreshNames(); requestAnimationFrame(frame); };
(document.fonts && document.fonts.load ? Promise.race([Promise.all([document.fonts.load('40px "Black Han Sans"'),document.fonts.load('900 40px "Noto Sans KR"'),document.fonts.load('700 40px "Chakra Petch"')]), new Promise(r=>setTimeout(r,1500))]) : Promise.resolve()).then(boot, boot);
})();
</script>
